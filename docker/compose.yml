# A name of its own. Without it compose takes the directory name, which is
# `docker` here and `docker` in osm-tokyo23-src-2026-08 too, and each project
# reports the other's containers as orphans and offers to remove them.
name: osm-wikidata-brand-tokyo23

services:
  build:
    build:
      context: .
      dockerfile: Dockerfile
    # The host's network, because the frozen extract's PostGIS is a container
    # of another repository's compose file and is reached on localhost:55433.
    # A bridge network here would need that port republished, which would make
    # this file depend on how the other one was started.
    network_mode: host
    environment:
      PG_DSN: ${PG_DSN:-host=localhost port=55433 dbname=osm user=osm password=osm}
      WIKIDATA_ITEMS: /work/tmp/wikidata.jsonl
    volumes:
      - ..:/work
      # The dump, read only and never decompressed: 96 GiB compressed is well
      # over a terabyte open and there is not that much disk.
      - ${WIKIDATA_DUMP_DIR:-/data/www/html/static/wikimedia/wikidata}:/dump:ro
    command: ["sleep", "infinity"]
