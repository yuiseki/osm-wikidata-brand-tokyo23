# Where every field comes from, and under what licence. Two sources with
# different licences are joined here, so this is field by field rather than
# file by file.
sources:
  - name: OpenStreetMap
    through: |
      tokyo23-260831.osm.pbf, the twenty-three special wards of Tokyo cut from
      the planet file of 2026-08-31, loaded into PostGIS by osm2pgsql and read
      with SQL. Nothing was fetched from the live API.
    file: tokyo23-260831.osm.pbf
    md5: 44a4ba2182379c147f20a27ad1b513ef
    bytes: 87399745
    osm_base: 2026-08-30T23:50:59Z
    published_as: https://huggingface.co/datasets/yuiseki/osm-tokyo23-src-2026-08
    upstream: https://planet.openstreetmap.org/pbf/planet-260831.osm.pbf
    licence: ODbL-1.0
    licence_url: https://www.openstreetmap.org/copyright
    licence_note: |
      The copyright page asks two things of anyone redistributing data derived
      from OpenStreetMap, and they are separate: credit OpenStreetMap, and make
      clear that the data is available under ODbL. Both are done in README.md
      and in this file.
    supplies:
      - qid
      - features
      - every key under `osm`, which is every name key carried by a feature
        tagged with that brand:wikidata, and how many features carry each
        spelling

  - name: Wikidata
    through: |
      wikidata-20260831-all.json.bz2, read once in a stream. The items taken
      are the 9,706 that the extract above points at through any *:wikidata
      key, plus every item carrying property P1282.
    file: wikidata-20260831-all.json.bz2
    bytes: 102943257005
    md5: f99e3ee0778ffe1c3b54fa5dbc6ce395
    sha1: b24eea0dee9f2fbe7ca70e6efe3209eb69bc48af
    checksums_from: |
      wikidata-20260831-md5sums.txt and -sha1sums.txt as the source publishes
      them, not as computed locally. A local checksum matching a local file
      proves nothing about what was downloaded.
    verified: |
      The copy that was read has md5 f99e3ee0778ffe1c3b54fa5dbc6ce395, computed
      over the 102,943,257,005 bytes on disk and equal to the figure above. So
      the dump that produced this file is the dump the source published, and
      not a truncated or resumed download that happened to be the right length.
    upstream: https://dumps.wikimedia.org/wikidatawiki/entities/20260831/
    items_read: 121519241
    items_kept: 13288
    licence: CC0-1.0
    licence_url: https://creativecommons.org/publicdomain/zero/1.0/
    licence_note: |
      Wikidata's licensing page says the CC0 applies to structured data in the
      main, property and lexeme namespaces; text in other namespaces is
      CC BY-SA 4.0. Everything taken here is structured data from the main
      namespace, so CC0 is the right one, and the distinction is written down
      because "Wikidata is CC0" is not true of the whole site.
      Wikidata requires no attribution.
      https://www.wikidata.org/wiki/Wikidata:Licensing
    supplies:
      - every key under `wikidata`: label, description, aliases, found

same_day: |
  Both sources are dated 2026-08-31. That is deliberate. A brand added to one
  in September and to the other in October would show up here as the two
  sources disagreeing, when the only difference is when each was read.

licensing:
  position: |
    The file contains content derived from OpenStreetMap, so redistributing
    the file means complying with ODbL-1.0. The Wikidata content is CC0 and
    carries no conditions of its own; being placed beside ODbL content does
    not put conditions on it, and being placed beside CC0 content does not
    remove them from the OpenStreetMap side.
  what_this_is_not: |
    Not legal advice, and not a ruling on whether the join makes a Derivative
    Database or a Collective Database under ODbL section 4.5. The two are
    joined on a shared key into one record rather than merely shipped in one
    archive, which is why the stricter reading is the one taken here.

    That reading has not been checked against the ODbL legal text. The
    OpenStreetMap copyright page does not draw the Derivative and Collective
    distinction at all and points at the Open Data Commons legal code and the
    OSMF licence page for it, and neither has been read. The position here is
    the cautious one taken without reading them, which is a reason to treat it
    as a starting point rather than as settled.
    https://opendatacommons.org/licenses/odbl/1-0/
    https://osmfoundation.org/wiki/Licence
  separating_them: |
    The two sides are in separate keys of every record, `osm` and `wikidata`,
    so a reader who wants only the CC0 half can take it without inspecting the
    values. Whether that extraction leaves ODbL behind is the reader's
    judgement to make; this file's position is only that the whole is ODbL.
  attribution: |
    (c) OpenStreetMap contributors, available under the Open Database License.
    https://www.openstreetmap.org/copyright

how_it_was_built: |
  Three steps, in this order, all of them in src/ and none of them reaching
  outside this repository by absolute path.

    src/qids.py              the 9,706 Wikidata ids the extract points at,
                             off all 31 of its *:wikidata keys
    src/wikidata_osm_tags.py one pass over the dump, 48 minutes, keeping the
                             items those ids name and the ones carrying P1282
    src/build.py             the join, and the counting of spellings

  The inputs are named by environment variable, PG_DSN and WIKIDATA_ITEMS, so
  that the same code runs against a rebuilt stack. Rerunning the three steps
  against the same two sources reproduces data/brands.jsonl byte for byte;
  that was checked rather than assumed.

code:
